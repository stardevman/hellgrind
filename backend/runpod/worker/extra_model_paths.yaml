# Network Volume'daki modeller (serverless worker'da /runpod-volume; Pod'da aynı volume /workspace'tedir).
# Volume yerleşimi (ComfyUI'nin klasör adları): models/unet, models/clip, models/vae, models/loras (+ checkpoints).
# diffusion_models ve text_encoders, ComfyUI'nin yeni adlarıdır: ikisi de aynı klasörlere bakar.
hellgrind_volume:
  base_path: /runpod-volume
  unet: |
    models/unet/
    models/diffusion_models/
  diffusion_models: |
    models/unet/
    models/diffusion_models/
  clip: |
    models/clip/
    models/text_encoders/
  text_encoders: |
    models/clip/
    models/text_encoders/
  vae: models/vae/
  loras: models/loras/
  checkpoints: models/checkpoints/
  clip_vision: models/clip_vision/
  upscale_models: models/upscale_models/
