# Birim fiyatlar (USD). Kaynak: fal.ai model sayfaları, Ekim 2026.
# Fiyatlar değişir: üretime geçmeden önce güncelle.
# DRY_RUN modunda da bu fiyatlar kullanılır; böylece Kill-Switch gerçekçi rakamlarla test edilir.

# Kendi GPU sunucunuzda çalışan motorlar. vast.ai makineyi saatle faturalar: tahmin = saatlik ücret / 3600 × video
# saniyesi başına GPU süresi × süre. Ücretli modda işlenen tutar, sunucunun her iş için bildirdiği GPU süresiyle hesaplanır;
# makinenin boşta geçen süresi de (boşta bekleme, kuyruk boşken) aynı saatlik ücretle son etkin projeye yazılır.
self_hosted:
  h3:                 # MiniMax H3. Yönetmenin ölçümü (Ekim 2026): ComfyUI, tek RTX 5090, int8_convrot, Turbo 8 adım, 124 kare.
    gpu_hourly_usd: 0.95      # vast.ai'deki 5090 makinesi 0,79-0,95 $/sa; bütçe tutucu olsun diye üst sınır
    render_seconds:           # bir video saniyesi için GPU saniyesi (124 kare = 5,17 sn)
      "480p": 8               # 864x480: 40,8 sn (model yüklemesi dahil)
      "720p": 16.5            # 1280x704: 85 sn
    keyframe_seconds: 40      # ComfyUI'de ilk kare (keyframe.json: Qwen-Image-2512, 50 adım, 1280x704); tahmini, ölçünce güncelleyin

serverless:
  runpod:             # MiniMax H3, RunPod Serverless (varsayılan platform). Flex worker fiyatları, runpod.io/pricing
                      # (sayfa 2026-10-05): RTX 5090 1,58 $/sa, RTX PRO 6000 (96 GB) 3,49 $/sa. Worker saniye saniye,
                      # açılıştan (model yükleme) kapanışa kadar faturalanır: iş + soğuk başlatma + boşta bekleme.
    per_second:
      "RTX 5090": 0.000439
      "RTX PRO 6000": 0.000969
    pools:                    # RunPod GPU havuz kimlikleri -> fiyat satırı (uç nokta ayarındaki adlar)
      ADA_32_PRO: "RTX 5090"
      BLACKWELL_96: "RTX PRO 6000"
    # Video saniyesi başına GPU saniyesi, model yüklüyken (sıcak worker), H3 koşuluna göre. Ölçümler (RTX 5090, fp8_scaled,
    # turbo, 4 sn klip = 107 kare): 2026-10-08 480p FL2VA 42-44 sn/klip, Ref2VA ~27 sn/klip; 2026-10-09 ("Kıvılcım") 720p
    # tam klip ort. 0,048 $ (9 klip) = ~109 sn/klip -> FL2VA 27 sn/sn. Ref2VA 720p aynı oranla (14 x 27/22). 480p test
    # klibi ort. 0,026 $ (13 klip) soğuk başlatmalarla birlikte; sıcak değer 11'de kalır.
    render_seconds:
      fl2va: {"480p": 11, "720p": 27}
      ref2va: {"480p": 7, "720p": 17}
    keyframe_seconds: 45        # storyboard ilk karesi (Qwen-Image-2512, 50 adım, 1280x704), sıcak worker: ölçülen 38-42
    keyframe_cold_seconds: 140  # soğuk worker'da ilk kare (açılış + model yükleme dahil, faturalanan): ölçülen ~139
    # Karakterli ilk kare (Qwen-Image-Edit-2511 fp8mixed, 1280x704), sıcak worker; soğukta keyframe_cold - keyframe farkı eklenir.
    keyframe_edit_seconds: 195          # tam (40 adım, cfg 4): ölçülen ~190-200 sn (2026-10-09, "Kıvılcım", RTX 5090)
    keyframe_edit_medium_seconds: 100   # orta (20 adım, cfg 4): başlangıç tahmini, ilk ölçümden sonra güncellenecek
    keyframe_edit_lightning_seconds: 15 # Lightning (4 adım, cfg 1): ölçülen kare model yükleme dahil 0,048 $ (~109 sn) = 15 + soğuk fark (95)
    cold_start_seconds: 140     # soğuk worker'da ilk video işine eklenen faturalanan süre (açılış + H3 yükleme): ~136-141

# fal.ai video motorları (Ekim 2026; model sayfaları ve yönetmenin ücretli karşılaştırma testi, aynı 5 referans, 10 sn 16:9).
fal_video:
  h3max:              # MiniMax H3 Max: istenen süre × saniye ücreti (uç noktaya göre) + referans token fazlası
    per_second: {"480P": 0.05, "768P": 0.08, "1080P": 0.16}           # reference-to-video
    per_second_i2v: {"480P": 0.03, "768P": 0.048, "1080P": 0.096}     # image-to-video
    included_reference_tokens: 4096   # her istekte dahil (4 görsel)
    image_tokens: 1024                # her girdi görseli (referans, ilk ve son kare) bu kadar token sayılır
    extra_per_1k_tokens: 0.02         # dahil olanın üstü
    billing_factor: 1.05              # test: 10 sn 768P + 5 görsel formülle 0,82 $, faturalanan 17,19 birim ≈ 0,86 $
                                      # (çıktı ~0,7 sn uzun olabilir, istem token'ları)
  seedance25:         # Seedance 2.5: token = yükseklik × genişlik × (girdi videosu sn + çıktı sn) × 24 / 1024
    per_1k_tokens: {"480p": 0.0214, "720p": 0.0214, "1080p": 0.0234}
    size: {"480p": [864, 480], "720p": [1280, 720], "1080p": [1920, 1080]}
    fps: 24
    token_divisor: 1024
    video_reference_factor: 0.6       # video referansı varsa; görsel ve ses referansı ücretsiz
    margin: 0.25                      # rezervasyon payı (test: formül 216 bin token, faturalanan 260,28 bin = 5,57 $)
    billing_factor: 1.2               # işlenen tutar: çıktının ölçülen token'ı × bu çarpan (217,7 bin ölçülen -> 260,3 bin)
    draft_resolution: "480p"          # draft: true -> 480p önizleme (480p token fiyatı) + draft_id (7 gün)
    complete:                         # draft/complete: YALNIZCA 1080p, ≈ 1,164 $/sn (10 sn ≈ 11,6 $)
      per_1k_tokens: 0.0234
      size: [1920, 1104]
      margin: 0.20
  flux3max:           # FLUX 3 Max image-to-video (blackforestlabs/flux-3-max/image-to-video): üretilen video saniyesi
                      # başına. Model sayfası 2026-10-27: %75 kampanya 15 Ekim - 7 Kasım 2026 (720p 0,0425 / 1080p 0,0725);
                      # kampanya bitince 720p 0,17 / 1080p 0,29 $/sn. 8 Kasım'dan önce per_second'ı list_per_second yapın.
    per_second: {"720p": 0.0425, "1080p": 0.0725}
    list_per_second: {"720p": 0.17, "1080p": 0.29}
    promo_until: "2026-11-07"
# Upscale (onaylanmış klipleri 1080p'ye çıkarma; ayrı adım). Çıktı karesi 1920x1080 = 2,07 MP, kaynak fps (24).
upscale:
  fal-ai/bytedance-upscaler/upscale/video:     # 30 fps'e kadar saniye başına; 60 fps'te 2 kat, "pro" 10 kat
    per_second: {"1080p": 0.0072, "2k": 0.0144, "4k": 0.0288}
    high_fps_factor: 2
    pro_factor: 10
  fal-ai/kandinsky6-vsr:                        # çıktı megapikseli × kare başına; en çok ~5 sn (121 kare)
    per_mp_frame: 0.00036
    max_seconds: 5
  fal-ai/seedvr/upscale/video:                  # video verisinin megapikseli başına (kare × MP)
    per_mp: 0.001
  fal-ai/flashvsr/upscale/video:
    per_mp: 0.0005
  blackforestlabs/flux-video-upscale:           # precise (creativity 0), 1080p; en çok 20 sn
    per_second: {"1080p": 0.14}
    max_seconds: 20
fal_image:            # fal.ai görsel modelleri, megapiksel başına (yukarı yuvarlanır); kare 1280x704 = 1 MP
  qwen_image: 0.02          # fal-ai/qwen-image-2512
  qwen_edit: 0.03           # fal-ai/qwen-image-edit-2511
  qwen_edit_lora: 0.035     # fal-ai/qwen-image-edit-2511/lora (Multiple Angles LoRA)

video_per_second:
  fal_wan:            # Wan 2.2 A14B image-to-video (yalnızca bu motorla açılmış eski çekimler)
    "480p": 0.04
    "720p": 0.08
  seedance:           # Seedance 2.0 Fast, ~1.21 USD / 5 sn 720p (yönetmenin Seedance seçtiği çekimler)
    "720p": 0.242
  wan_v2v:            # Wan 2.2 A14B video-to-video (previs rehberi), 16 fps'deki saniye başına
    "480p": 0.04
    "580p": 0.06
    "720p": 0.08
  higgsfield:         # henüz kullanılmıyor; tahmini
    "720p": 0.25
image_per_megapixel:
  flux_lora: 0.035
image_per_image:
  flux_kontext: 0.04   # Flux Kontext [pro]: karakterin referans görseliyle kare, görsel başına (fal.ai, Ekim 2026)
lipsync_per_minute: 5.0
# Aşağıdaki iki kalem brifingdeki fal.ai fiyatları gibi doğrulanmış DEĞİL; ücretli moda geçmeden önce kendi planına göre güncelle.
tts_per_1k_chars: 0.30         # ElevenLabs, tahmini (plana göre değişir)
llm_per_million_tokens:        # Claude, tabloda olmayan model için yedek (tahmini)
  input: 3.0
  output: 15.0
llm_models:                    # Anthropic, USD / 1M belirteç (girdi / çıktı), Ekim 2026
  claude-opus-5-5: {input: 4.0, output: 20.0}
  claude-sonnet-5-5: {input: 2.0, output: 10.0}
  claude-haiku-5-5:            # istem 100k belirteci aşarsa yüksek kademe
    input: 0.10
    output: 0.50
    long_threshold: 100000
    long_input: 0.50
    long_output: 2.50
