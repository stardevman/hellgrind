<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hell Grind – kontrol odası</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
:root{
  --slag:#2A2D31; --plate:#33373C; --plate-2:#3B4046; --line:#4A5057;
  --ash:#E6E1D8; --dust:#A39E95;
  --ember:#E4A23E; --verdigris:#62AE8E; --oxide:#C2573F; --steel:#86A5B8;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--slag);color:var(--ash);font-family:var(--font);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
a{color:var(--steel)}
.num{font-variant-numeric:tabular-nums}

/* üst bant */
.top{display:flex;align-items:center;gap:20px;padding:14px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mark{font-weight:850;font-stretch:125%;font-size:22px;letter-spacing:-.01em;margin:0}
.mark small{font-weight:400;font-stretch:100%;font-size:13px;color:var(--dust);margin-left:10px;letter-spacing:0}
.top select{background:var(--plate);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:220px}
.spacer{flex:1}
.btn{background:var(--plate-2);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--dust)}
.btn.primary{background:var(--ember);border-color:var(--ember);color:#2A1C05;font-weight:650}
.btn.stop{background:transparent;border-color:var(--oxide);color:#F0B4A6}
.btn.stop:hover{background:var(--oxide);color:#fff}
.btn.go{border-color:var(--verdigris);color:#BDE5D3}
.btn:disabled{opacity:.45;cursor:not-allowed}
.free{font-size:13px;color:var(--verdigris);border:1px solid #3E6B59;border-radius:20px;padding:3px 10px}

/* bütçe rayı */
.rail{padding:12px 24px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:center}
.bar{height:10px;background:var(--plate);border-radius:5px;overflow:hidden;display:flex}
.bar .spent{background:var(--ember)} .bar .res{background:repeating-linear-gradient(45deg,var(--ember) 0 4px,transparent 4px 8px);opacity:.6}
.bar.soft .spent{background:#E07B3E} .bar.frozen .spent{background:var(--oxide)}
.rail .figures{font-size:14px;color:var(--dust)} .rail .figures b{color:var(--ash);font-weight:650}
.banner{margin:0 24px;padding:10px 14px;border:1px solid var(--oxide);border-radius:6px;background:#3A2B28;display:flex;gap:12px;align-items:center}

/* ana ızgara */
main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:0;min-height:60vh}
@media (max-width:1100px){main{grid-template-columns:1fr}.inspector{border-left:none;border-top:1px solid var(--line);position:static;max-height:none}}
@media (max-width:640px){.scene{grid-template-columns:1fr auto;padding:14px 16px}.scene>div:nth-child(2){grid-column:1/-1;grid-row:2}
  .code{font-size:19px}.top,.rail{padding-left:16px;padding-right:16px}.top select{min-width:0;flex:1}}
.scenes{padding:8px 0}
.scene{display:grid;grid-template-columns:132px minmax(0,1fr) 84px;gap:16px;padding:14px 24px;border-bottom:1px solid #383C42;cursor:pointer;align-items:center}
.scene:hover{background:#2F3237}
.scene.sel{background:var(--plate);box-shadow:inset 3px 0 0 var(--ember)}
.code{font-stretch:70%;font-weight:750;font-size:21px;line-height:1.05;letter-spacing:.01em}
.state{font-size:13px;color:var(--dust);margin-top:2px}
.state.running{color:var(--ember)} .state.done{color:var(--verdigris)} .state.bad{color:#E79A88}
.desc{font-size:13px;color:var(--dust);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.money{text-align:right;font-size:13px;color:var(--dust)}
.money b{display:block;color:var(--ash);font-weight:600;font-size:15px}

/* film şeridi: elemenin görünür hâli */
.strip{display:flex;gap:3px;padding:7px 6px;background:#1E2023;border-radius:3px;overflow-x:auto;position:relative;
  background-image:radial-gradient(circle,#3A3E44 1.6px,transparent 2px),radial-gradient(circle,#3A3E44 1.6px,transparent 2px);
  background-size:10px 7px;background-repeat:repeat-x;background-position:0 0,0 100%}
.strip .gap{width:10px;flex:none}
.tile{flex:none;width:58px;height:33px;border-radius:2px;background:#2C3035 center/cover;position:relative;border:1px solid transparent}
.tile.probe{width:42px;height:24px;align-self:center;border-color:#4F6573}
.tile.passed{border-color:#4A7F69}
.tile.refined{border:2px solid var(--verdigris)}
.tile.refined b{position:absolute;top:-1px;left:2px;font-size:11px;font-weight:800;color:#fff;text-shadow:0 0 3px #000}
.tile.purged,.tile.retired{filter:grayscale(1) brightness(.55)}
.tile.purged::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent 47%,var(--oxide) 48% 52%,transparent 53%)}
.tile.running{background:#3B3326;animation:breathe 1.4s ease-in-out infinite}
.tile.failed{background:#3A2B28}
@keyframes breathe{50%{background:#5A4520}}
@media (prefers-reduced-motion:reduce){.tile.running{animation:none}}
.legend{display:flex;gap:16px;font-size:12px;color:var(--dust);padding:10px 24px 4px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:9px;margin-right:6px;vertical-align:middle;border-radius:2px}

/* denetçi */
.inspector{border-left:1px solid var(--line);padding:18px 22px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
.inspector h2{font-stretch:80%;font-weight:800;font-size:28px;margin:0 0 2px;line-height:1.1}
.inspector h3{font-size:14px;font-weight:650;margin:20px 0 8px;color:var(--ash)}
.inspector .sub{color:var(--dust);font-size:13px;margin:0 0 12px}
video{width:100%;border-radius:4px;background:#000;display:block}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick{font-size:12px;color:var(--dust)}
.pick video{aspect-ratio:16/9;object-fit:cover}
.pick .row{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:4px}
.pick.first video{outline:2px solid var(--verdigris)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:13px}
.kv dt{color:var(--dust)} .kv dd{margin:0}
.lines{list-style:none;padding:0;margin:0;font-size:14px}
.lines li{padding:6px 0;border-bottom:1px solid #3A3E44}
.lines li span{color:var(--dust);font-size:12px;margin-left:6px}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:var(--plate);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.note{font-size:13px;color:var(--dust);margin:8px 0 0}
.note.ok{color:var(--verdigris)}
.err{font-size:13px;color:#E79A88;white-space:pre-wrap}

/* film bölümü */
.film{border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) 400px}
@media (max-width:1100px){.film{grid-template-columns:1fr}}
.film section{padding:20px 24px}
.film h2{font-stretch:110%;font-weight:800;font-size:20px;margin:0 0 12px}
.cut{display:flex;height:22px;margin-top:10px;border-radius:3px;overflow:hidden;gap:2px}
.cut div{font-size:11px;padding:3px 5px;color:#1E1E1E;font-weight:700;white-space:nowrap;overflow:hidden;cursor:pointer}
.events{list-style:none;padding:0;margin:0;font-size:13px;max-height:280px;overflow:auto}
.events li{padding:5px 0;border-bottom:1px solid #383C42;color:var(--dust)}
.events li b{color:var(--ash);font-weight:600}
.events li.kill b{color:#F0B4A6}

/* yeni proje */
.empty{max-width:760px;margin:40px auto;padding:0 24px}
.empty h1{font-stretch:125%;font-weight:850;font-size:40px;line-height:1.05;margin:0 0 10px;letter-spacing:-.015em}
.empty p{color:var(--dust);max-width:62ch}
.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.field label{font-size:13px;color:var(--dust)}
textarea{width:100%;min-height:260px;line-height:1.45;font-size:14px}
dialog{background:var(--slag);color:var(--ash);border:1px solid var(--line);border-radius:8px;padding:0;max-width:820px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(20,22,25,.7)}
</style>
</head>
<body>
<header class="top">
  <h1 class="mark">Hell Grind<small>kontrol odası</small></h1>
  <select id="projectSel" aria-label="Proje"></select>
  <button class="btn" id="newBtn">Yeni proje</button>
  <span class="spacer"></span>
  <span class="free" id="modeTag" hidden>Ücretsiz mod: hiçbir ücretli servis çağrılmaz</span>
</header>

<div id="app"></div>

<dialog id="newDlg"><div class="empty" style="margin:24px auto" id="newForm"></div></dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = n => "$" + Number(n || 0).toFixed(2);
const STATUS = {pending:"Sırada", parsed:"Ayrıştırıldı", probing:"Test turu", generating:"Tam tur", correcting:"Yeniden deneniyor",
  refined:"Rafine havuz hazır", needs_review:"Yönetmen onayı gerekli", audio:"Ses üretiliyor", lipsync:"Dudak senkronu",
  muxing:"Montaj", done:"Tamamlandı", failed:"Hata", frozen:"Donduruldu"};
const RUNNING = new Set(["pending","probing","generating","correcting","audio","lipsync","muxing"]);
const EMO = {neutral:"Nötr", joy:"Neşe", anger:"Öfke", fear:"Korku", sadness:"Hüzün", surprise:"Şaşkınlık", disgust:"Tiksinti", tension:"Gerilim"};
const EMO_COLOR = {neutral:"#A8B0B8", joy:"#E9C76A", anger:"#E07B3E", fear:"#8C8FD6", sadness:"#7FA0BF", surprise:"#D79AD0", disgust:"#A9B45A", tension:"#D6A266"};

let META = null, PID = localStorage.getItem("hg.pid"), DATA = null, SEL = null, PREVIEW = null, LASTSIG = {}, NOTE = "";

async function api(path, opts = {}) {
  const r = await fetch("/api" + path, {headers: {"Content-Type": "application/json"}, ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined});
  const t = await r.text(); let j; try { j = JSON.parse(t) } catch { j = t }
  if (!r.ok) throw new Error((j && j.detail) ? (typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail)) : r.status);
  return j;
}

function stagesText(st) {
  if (!st || !st.length) return "Değişiklik yok, hiçbir aşama çalışmadı.";
  if (st.includes("VISUAL")) return "Görüntü baştan üretilecek; ardından ses ve montaj yeniden yapılacak.";
  if (st.includes("LIPSYNC")) return "Yalnızca ses ve montaj; görüntü motoru çağrılmadı.";
  return "Yalnızca montaj; görüntü motoru çağrılmadı.";
}

/* ---------- yeni proje ---------- */
function newProjectForm(inDialog) {
  return `
  <h1>${inDialog ? "Yeni proje" : "İlk sahneni üret"}</h1>
  <p>Senaryoyu yapıştır; sistem sahnelere ayırır, her çekim için varyasyonlar üretir, kalite kontrolünden geçirir, en iyi üçü seçer, sesi ekler ve montajlar. Bu modda her şey bilgisayarında, ücretsiz çalışır. Bütçe, gerçek sağlayıcı fiyatlarıyla sanal olarak tutulur.</p>
  <div class="field"><label for="f_title">Proje adı</label><input id="f_title" value="Hell Grind – deneme"></div>
  <div class="form">
    <div class="field"><label for="f_budget">Sanal bütçe (USD)</label><input id="f_budget" type="number" min="1" step="1" value="60" style="width:140px">
      <span class="note" style="margin:0;max-width:34ch">Hız bekçisi: 10 dakikada bütçenin yarısından fazlası harcanırsa üretim kendiliğinden durur.</span></div>
    <div class="field"><label for="f_preset">Üretim yoğunluğu</label>
      <select id="f_preset"><option value="preview">Hızlı önizleme: 4 test + 8 tam varyasyon</option>
      <option value="brief">Brifing: 10 test + 50'ye kadar tam varyasyon (yavaş)</option></select></div>
  </div>
  <div class="field"><label for="f_script">Senaryo</label><textarea id="f_script">${esc(META.sample_script)}</textarea></div>
  <div class="form"><button class="btn primary" id="f_go">Senaryoyu işle ve üret</button>
  ${inDialog ? '<button class="btn" id="f_cancel">Vazgeç</button>' : ""}<span class="note" id="f_note"></span></div>`;
}

function bindNewForm(root, dlg) {
  $("#f_go", root).onclick = async () => {
    const note = $("#f_note", root); note.className = "note"; note.textContent = "Proje oluşturuluyor…";
    try {
      const budget = Number($("#f_budget", root).value);
      // Hız bekçisi eşiği bütçenin yarısı: örnek film (~22 USD sanal) bitince kendiliğinden donmasın, gerçek kaçak harcama yine yakalansın
      const p = await api("/projects", {method: "POST", body: {title: $("#f_title", root).value, budget_limit_usd: budget,
        settings: {...META.presets[$("#f_preset", root).value], max_spend_per_10min: budget / 2}}});
      note.textContent = "Senaryo ayrıştırılıyor…";
      const r = await api(`/projects/${p.id}/script`, {method: "POST", body: {text: $("#f_script", root).value}});
      PID = p.id; localStorage.setItem("hg.pid", PID); SEL = null; dlg && dlg.close();
      NOTE = `${r.shots} çekim ve ${r.cast.length} karakter bulundu (${r.cast.join(", ")}). Üretim başladı.`;
      await loadProjects(); refresh(true);
    } catch (e) { note.className = "err"; note.textContent = e.message }
  };
  const c = $("#f_cancel", root); if (c) c.onclick = () => dlg.close();
}

/* ---------- çizim ---------- */
function tile(v) {
  const fate = v.status === "purged" && (v.reason === "not_top_k" || v.reason === "superseded") ? "retired" : v.status;
  const cls = ["tile", v.tier, fate].join(" ");
  const bg = v.thumb_url ? `style="background-image:url('${v.thumb_url}')"` : "";
  const tip = `${v.tier === "probe" ? "Test" : "Tam"} varyasyon, skor ${v.score?.toFixed(3) ?? "–"}` +
    (v.anomalies.length ? `, elendi: ${v.anomalies.join(", ")}` : fate === "retired" ? (v.reason === "superseded" ? ", önceki üretimden kaldı" : ", havuza girmedi") : "") + (v.rank ? `, rafine #${v.rank}` : "");
  return `<button class="${cls}" ${bg} title="${esc(tip)}" aria-label="${esc(tip)}" data-v="${v.id}">${v.rank ? `<b>${v.rank}</b>` : ""}</button>`;
}

function sceneRow(s) {
  const probes = s.variations.filter(v => v.tier === "probe"), full = s.variations.filter(v => v.tier === "full");
  const st = RUNNING.has(s.status) ? "running" : s.status === "done" ? "done" : ["failed","frozen","needs_review"].includes(s.status) ? "bad" : "";
  const strip = s.variations.length ? probes.map(tile).join("") + (full.length ? '<span class="gap"></span>' + full.map(tile).join("") : "")
                                    : '<span class="state" style="padding:6px 4px">Henüz varyasyon yok</span>';
  return `<div class="scene ${SEL === s.id ? "sel" : ""}" data-s="${s.id}" tabindex="0">
    <div><div class="code">${esc(s.scene_code)}</div><div class="state ${st}">${STATUS[s.status] || s.status}</div></div>
    <div><div class="desc">${esc(s.description)}</div><div class="strip">${strip}</div></div>
    <div class="money num"><b>${usd(s.spent_usd)}</b>${s.duration_s} sn</div></div>`;
}

function inspector(s) {
  if (!s) return `<p class="sub">Bir sahne seç: üretilen tüm varyasyonları, seçilen en iyi üçü ve montajlanmış sonucu burada görürsün.</p>`;
  const refined = s.variations.filter(v => v.rank).sort((a, b) => a.rank - b.rank);
  const prev = PREVIEW && s.variations.find(v => v.id === PREVIEW);
  const chars = s.tracks.filter(t => t.kind === "dialogue");
  const music = s.tracks.find(t => t.kind === "music");
  const poster = refined[0]?.thumb_url || "";
  return `
  <h2>${esc(s.scene_code)}</h2><p class="sub">${esc(s.heading || "")}</p>
  ${prev ? `<h3>Varyasyon önizleme</h3>
    ${prev.video_url ? `<video src="${prev.video_url}" poster="${prev.thumb_url || ""}" controls autoplay muted playsinline></video>` : `<p class="note">Bu varyasyonun videosu yok.</p>`}
    <p class="note">${prev.tier === "probe" ? "Test turu" : "Tam tur"}, skor ${prev.score?.toFixed(3) ?? "–"}${prev.anomalies.length ? `, elenme nedeni: ${prev.anomalies.map(a => ({black:"siyah kare",freeze:"donmuş görüntü",low_clip:"düşük skor"}[a] || a)).join(", ")}` : ""}.
    <button class="btn" id="closePrev" style="padding:3px 8px;margin-left:6px">Kapat</button></p>` : ""}
  <h3>Sonuç</h3>
  ${s.final_url ? `<video src="${s.final_url}" poster="${poster}" controls playsinline></video>` : `<p class="note">${RUNNING.has(s.status) ? "Üretim sürüyor; montaj bitince burada oynatılır." : "Henüz montajlanmış video yok."}</p>`}
  ${s.last_error && s.status !== "done" ? `<p class="err">${esc(s.last_error.split("\n")[0])}</p>` : ""}
  ${refined.length ? `<h3>Rafine havuz</h3><div class="picks">${refined.map(v => `
    <div class="pick ${v.rank === 1 ? "first" : ""}"><video src="${v.video_url}" poster="${v.thumb_url || ""}" muted loop playsinline onmouseenter="this.play()" onmouseleave="this.pause()"></video>
    <div class="row"><span class="num">#${v.rank} ${v.score?.toFixed(3)}</span>${v.rank === 1 ? "<span>Kullanılıyor</span>" :
      `<button class="btn" style="padding:2px 8px" data-promote="${v.id}">Bunu kullan</button>`}</div></div>`).join("")}</div>` : ""}
  <h3>Çekim</h3>
  <dl class="kv"><dt>Duygu</dt><dd>${EMO[s.emotion] || s.emotion}</dd>
    <dt>Kamera</dt><dd>${esc(s.camera.shot)}, ${esc(s.camera.movement)}</dd>
    <dt>Karakterler</dt><dd>${esc(s.characters.join(", ") || "yok")}</dd>
    <dt>Motor</dt><dd>${esc(s.engine || "–")}${s.action_complexity >= .7 ? " (aksiyon)" : ""}</dd>
    <dt>Varyasyon</dt><dd class="num">${s.variations.length} üretildi, ${s.variations.filter(v => v.status === "purged").length} elendi</dd></dl>
  ${chars.length ? `<h3>Diyalog</h3><ul class="lines">${chars.map(t => `<li>${esc(t.text)}<span>${EMO[t.emotion] || ""}, ${t.start_offset_s.toFixed(1)} sn</span></li>`).join("")}</ul>` : ""}
  <h3>Müziği değiştir</h3>
  <div class="form"><select id="mood" aria-label="Müzik duygusu">${Object.entries(EMO).map(([k, v]) =>
    `<option value="${k}" ${(music?.mood || s.emotion) === k ? "selected" : ""}>${v}</option>`).join("")}</select>
    <select id="gain" aria-label="Müzik seviyesi">${[-14,-10,-8,-6,-3].map(g => `<option ${music && music.gain_db === g ? "selected" : ""} value="${g}">${g} dB</option>`).join("")}</select>
    <button class="btn" id="musicBtn" ${s.status === "done" ? "" : "disabled"}>Müziği uygula</button></div>
  <p class="note">Yalnızca montaj yeniden yapılır; görüntü motoru çağrılmaz.</p>
  <h3>Yeniden üret</h3>
  <div class="form"><button class="btn" id="forceBtn" ${RUNNING.has(s.status) ? "disabled" : ""}>Bu sahneyi baştan üret</button></div>
  <p class="note" id="actNote"></p>`;
}

function filmSection(d) {
  const done = d.scenes.filter(s => s.status === "done" && s.final_url).length;      // montaj yalnızca tamamlananları alır
  const tl = d.timeline;
  const cut = tl?.cut?.clips || [];
  const total = tl?.cut?.duration_s || 1;
  return `<section>
    <h2>Film</h2>
    <div class="form"><button class="btn primary" id="assembleBtn" ${done ? "" : "disabled"}>Tamamlanan ${done} sahneyi birleştir</button>
    ${tl ? `<a href="${tl.url}" download>Filmi indir</a>` : ""}</div>
    ${tl ? `<div style="margin-top:12px"><video id="filmVid" src="${tl.url}" poster="${d.scenes[0]?.variations.find(v => v.rank === 1)?.thumb_url || ""}" controls playsinline></video>
      <div class="cut">${cut.map(c => { const s = d.scenes.find(x => x.scene_code === c.scene_code);
        return `<div style="flex:${(c.out_s - c.in_s) / total};background:${EMO_COLOR[s?.emotion] || "#999"}" data-seek="${c.in_s}" title="${esc(c.description)}">${esc(c.scene_code)}</div>`}).join("")}</div>
      <p class="note num">${cut.length} sahne, ${total.toFixed(1)} saniye</p></div>`
      : `<p class="note">Sahneler tamamlandıkça buradan tek bir film olarak birleştirebilirsin.</p>`}
  </section>
  <section><h2>Olaylar</h2><ul class="events">${d.events.map(eventLi).join("") || '<li>Henüz olay yok.</li>'}</ul></section>`;
}

function eventLi(e) {
  const t = new Date(e.ts * 1000).toLocaleTimeString("tr-TR");
  const sc = DATA?.scenes.find(s => s.id === e.scene_id)?.scene_code || "";
  const txt = {
    probe_wave: () => `<b>${sc}</b> test turu ${e.round + 1}: ortalama ${e.mean_composite}, geçme oranı %${Math.round(e.pass_rate * 100)}`,
    full_wave: () => `<b>${sc}</b> tam dalga ${e.wave}: ${e.n} varyasyon, mükemmel aday ${e.excellent}`,
    soft_limit: () => `<b>Bütçe uyarısı</b>: harcama ${usd(e.spent)} / ${usd(e.limit)}`,
    soft_limit_stop: () => `<b>${sc}</b> yumuşak limit nedeniyle tam tur erken bitti`,
    frozen: () => `<b>Üretim donduruldu</b>: ${esc(e.reason)}`,
    resumed: () => `<b>Üretim devam ediyor</b>`,
    timeline: () => e.error ? `<b>Film</b>: ${esc(e.error)}` : `<b>Film birleştirildi</b>: ${e.scenes} sahne`,
  }[e.kind];
  return `<li class="${e.kind === "frozen" ? "kill" : ""}"><span class="num">${t}</span> ${txt ? txt() : esc(e.kind)}</li>`;
}

function render(d) {
  const p = d.project, app = $("#app");
  const pct = v => Math.min(100, v / p.budget_limit_usd * 100);
  const sig = JSON.stringify(d);
  if (LASTSIG.all === sig) return; LASTSIG.all = sig;
  const sel = d.scenes.find(s => s.id === SEL);
  const inspSig = JSON.stringify([sel, PREVIEW]);
  const keepInspector = LASTSIG.insp === inspSig && $(".inspector");
  const oldInsp = keepInspector ? $(".inspector") : null;
  const filmSig = JSON.stringify([d.timeline, d.events, d.scenes.map(s => [s.final_url, s.emotion])]);
  const oldFilm = LASTSIG.film === filmSig ? $(".film") : null;
  app.innerHTML = `
  <div class="rail"><div class="bar ${p.frozen ? "frozen" : p.soft_limited ? "soft" : ""}" role="img" aria-label="Bütçe kullanımı">
      <div class="spent" style="width:${pct(p.spent_usd)}%"></div><div class="res" style="width:${pct(p.reserved_usd)}%"></div></div>
    <div>${p.frozen ? `<button class="btn go" id="resumeBtn">Üretime devam et</button>` : `<button class="btn stop" id="freezeBtn">Üretimi durdur</button>`}</div>
    <div class="figures num"><b>${usd(p.spent_usd)}</b> ${p.dry_run ? "sanal harcama" : "harcandı"}, ${usd(p.reserved_usd)} ayrıldı, limit ${usd(p.budget_limit_usd)}${p.soft_limited ? ". Yumuşak limite ulaşıldı: yeni tam dalga başlatılmıyor." : ""}</div>
    <div class="figures">${NOTE ? esc(NOTE) : ""}</div></div>
  ${p.frozen ? `<div class="banner" role="alert">Üretim donduruldu. Kuyruktaki işler iptal edildi; yeni üretim başlatılamaz.</div>` : ""}
  <div class="legend"><span><i style="border:1px solid #4F6573;background:#2C3035"></i>Test turu</span><span><i style="border:1px solid #4A7F69;background:#2C3035"></i>Eşiği geçti</span>
    <span><i style="border:2px solid var(--verdigris)"></i>Rafine havuz</span><span><i style="background:linear-gradient(to top right,#555 46%,var(--oxide) 47% 53%,#555 54%)"></i>Kalite kontrolünde elendi</span>
    <span><i style="background:#3A3D41"></i>Havuza girmedi</span>
    <span><i style="background:#5A4520"></i>Üretiliyor</span></div>
  <main><div class="scenes">${d.scenes.map(sceneRow).join("") || '<p class="sub" style="padding:24px">Bu projede sahne yok.</p>'}</div>
    <aside class="inspector" aria-live="polite"></aside></main>
  <div class="film"></div>`;
  if (oldInsp) app.querySelector(".inspector").replaceWith(oldInsp);
  else { $(".inspector").innerHTML = inspector(sel); bindInspector(sel); LASTSIG.insp = inspSig }
  if (oldFilm) app.querySelector(".film").replaceWith(oldFilm);
  else { $(".film").innerHTML = filmSection(d); bindFilm(); LASTSIG.film = filmSig }
  bindMain();
}

/* ---------- etkileşim ---------- */
function bindMain() {
  document.querySelectorAll(".scene").forEach(el => {
    const pick = () => { SEL = el.dataset.s; PREVIEW = null; LASTSIG = {}; render(DATA) };
    el.onclick = e => { if (!e.target.closest(".tile")) pick() };
    el.onkeydown = e => { if (e.key === "Enter") pick() };
  });
  document.querySelectorAll(".tile").forEach(el => el.onclick = () => {
    SEL = el.closest(".scene").dataset.s; PREVIEW = el.dataset.v; LASTSIG = {}; render(DATA);
  });
  const f = $("#freezeBtn"), r = $("#resumeBtn");
  if (f) f.onclick = async () => { await api(`/projects/${PID}/killswitch`, {method: "POST", body: {action: "freeze", reason: "Yönetmen panelden durdurdu"}}); refresh(true) };
  if (r) r.onclick = async () => { await api(`/projects/${PID}/killswitch`, {method: "POST", body: {action: "resume"}}); refresh(true) };
}

function bindInspector(s) {
  if (!s) return;
  const note = msg => { const n = $("#actNote"); if (n) { n.className = "note ok"; n.textContent = msg } };
  const fail = e => { const n = $("#actNote"); if (n) { n.className = "err"; n.textContent = e.message } };
  const cp = $("#closePrev"); if (cp) cp.onclick = () => { PREVIEW = null; LASTSIG = {}; render(DATA) };
  const mb = $("#musicBtn"); if (mb) mb.onclick = async () => {
    try { const r = await api(`/scenes/${s.id}/audio`, {method: "PUT", body: {kind: "music", source: "procedural",
      params: {mood: $("#mood").value}, gain_db: Number($("#gain").value)}}); note(stagesText(r.stages)); refresh(true) } catch (e) { fail(e) } };
  const fb = $("#forceBtn"); if (fb) fb.onclick = async () => {
    try { const r = await api(`/scenes/${s.id}/render?force_visual=true`, {method: "POST"}); note(stagesText(r.stages)); refresh(true) } catch (e) { fail(e) } };
  document.querySelectorAll("[data-promote]").forEach(b => b.onclick = async () => {
    try { const r = await api(`/scenes/${s.id}/promote/${b.dataset.promote}`, {method: "POST"}); note(stagesText(r.stages)); refresh(true) } catch (e) { fail(e) } });
}

function bindFilm() {
  const a = $("#assembleBtn"); if (a) a.onclick = async () => { a.disabled = true; a.textContent = "Birleştiriliyor…"; await api(`/projects/${PID}/assemble`, {method: "POST"}) };
  document.querySelectorAll("[data-seek]").forEach(el => el.onclick = () => { const v = $("#filmVid"); v.currentTime = Number(el.dataset.seek); v.play() });
}

/* ---------- veri ---------- */
async function loadProjects() {
  const list = await api("/projects");
  const sel = $("#projectSel");
  sel.innerHTML = list.map(p => `<option value="${p.id}" ${p.id === PID ? "selected" : ""}>${esc(p.title)}</option>`).join("");
  sel.hidden = !list.length;
  if (!list.find(p => p.id === PID)) PID = list[0]?.id || null;
  return list;
}

async function refresh(force) {
  if (!PID) { $("#app").innerHTML = `<div class="empty">${newProjectForm(false)}</div>`; bindNewForm($("#app")); return }
  try { const d = await api(`/projects/${PID}/overview`); if (force) LASTSIG = {}; DATA = d; render(d) }
  catch (e) { $("#app").innerHTML = `<div class="empty"><p class="err">Sunucuya ulaşılamadı: ${esc(e.message)}</p></div>` }
}

(async function init() {
  META = await api("/meta");
  $("#modeTag").hidden = !META.dry_run;
  await loadProjects();
  $("#projectSel").onchange = e => { PID = e.target.value; localStorage.setItem("hg.pid", PID); SEL = null; PREVIEW = null; NOTE = ""; refresh(true) };
  $("#newBtn").onclick = () => { const f = $("#newForm"); f.innerHTML = newProjectForm(true); bindNewForm(f, $("#newDlg")); $("#newDlg").showModal() };
  refresh(true);
  setInterval(() => { if (!document.hidden && !$("#newDlg").open) refresh(false) }, 2000);
})();
</script>
</body>
